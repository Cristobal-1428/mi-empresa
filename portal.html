<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Proyecto — StudioCP</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/portal.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="portal-header-bar">
    <a href="index.html" class="logo">Studio<span class="logo-cp">CP</span></a>
    <div class="portal-user">
      <span id="user-name"></span>
      <button class="btn btn-sm btn-ghost" id="btn-logout">Cerrar sesión</button>
    </div>
  </header>

  <main class="portal-main">

    <!-- Sin proyecto asignado -->
    <div id="no-project" class="portal-empty" hidden>
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <h2>Aún no tienes un proyecto activo</h2>
      <p>El equipo de StudioCP te avisará cuando tu proyecto esté configurado.</p>
      <a href="index.html#contacto" class="btn" style="margin-top:20px">Contactar</a>
    </div>

    <!-- Datos del proyecto -->
    <div id="project-data" hidden>

      <div class="portal-title-row">
        <div>
          <p class="eyebrow"><span class="mono">&lt;</span> Tu Proyecto <span class="mono">/&gt;</span></p>
          <h1 id="project-name"></h1>
        </div>
        <span class="phase-badge" id="phase-badge"></span>
      </div>

      <!-- Fases -->
      <section class="portal-card">
        <h2 class="portal-card-title">Progreso</h2>
        <ul id="phases-list" class="phases-timeline" role="list"></ul>
      </section>

      <!-- Actualizaciones -->
      <section class="portal-card">
        <h2 class="portal-card-title">Actualizaciones</h2>
        <div id="updates-list"></div>
      </section>

      <!-- Archivos -->
      <section class="portal-card">
        <h2 class="portal-card-title">Archivos para revisar</h2>
        <div id="files-list"></div>
      </section>

    </div>
  </main>

  <script type="module" src="js/portal.js"></script>
</body>
</html>
