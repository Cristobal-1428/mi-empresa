<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceder — StudioCP</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/portal.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body class="auth-body">

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Studio<span class="logo-cp">CP</span></a>
      <nav class="nav" aria-label="Navegación principal">
        <button class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Abrir menú">
          <span></span><span></span><span></span>
        </button>
        <ul id="nav-menu" class="nav-menu">
          <li><a href="servicios.html">Servicios</a></li>
          <li><a href="index.html#proyectos">Proyectos</a></li>
          <li><a href="index.html#como-trabajamos">Proceso</a></li>
          <li><a href="index.html#contacto">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="auth-card">
    <h1 id="auth-title">Accede a tu portal</h1>
    <p class="auth-sub" id="auth-sub">Consulta el estado de tu proyecto en tiempo real.</p>

    <!-- Botón Google -->
    <button class="btn-google" id="btn-google">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continuar con Google
    </button>

    <div class="auth-divider"><span>o</span></div>

    <!-- Formulario -->
    <form id="auth-form" novalidate>

      <!-- ── Campos solo en REGISTRO ── -->
      <div id="register-extra" hidden>
        <div class="field-row">
          <div class="field">
            <label for="auth-nombre">Nombre</label>
            <input type="text" id="auth-nombre" placeholder="Tu nombre" />
          </div>
          <div class="field">
            <label for="auth-apellido">Apellido</label>
            <input type="text" id="auth-apellido" placeholder="Tu apellido" />
          </div>
        </div>
        <div class="field">
          <label for="auth-pais">País</label>
          <select id="auth-pais" class="field-select">
            <option value="">Selecciona tu país</option>
            <optgroup label="América Latina">
              <option value="Chile">Chile</option>
              <option value="Argentina">Argentina</option>
              <option value="Bolivia">Bolivia</option>
              <option value="Brasil">Brasil</option>
              <option value="Colombia">Colombia</option>
              <option value="Costa Rica">Costa Rica</option>
              <option value="Cuba">Cuba</option>
              <option value="Ecuador">Ecuador</option>
              <option value="El Salvador">El Salvador</option>
              <option value="Guatemala">Guatemala</option>
              <option value="Honduras">Honduras</option>
              <option value="México">México</option>
              <option value="Nicaragua">Nicaragua</option>
              <option value="Panamá">Panamá</option>
              <option value="Paraguay">Paraguay</option>
              <option value="Perú">Perú</option>
              <option value="República Dominicana">República Dominicana</option>
              <option value="Uruguay">Uruguay</option>
              <option value="Venezuela">Venezuela</option>
            </optgroup>
            <optgroup label="Otros">
              <option value="España">España</option>
              <option value="Estados Unidos">Estados Unidos</option>
              <option value="Canada">Canadá</option>
              <option value="Reino Unido">Reino Unido</option>
              <option value="Alemania">Alemania</option>
              <option value="Francia">Francia</option>
              <option value="Italia">Italia</option>
              <option value="Portugal">Portugal</option>
              <option value="Otro">Otro</option>
            </optgroup>
          </select>
        </div>
      </div>

      <!-- ── Siempre visibles ── -->
      <div class="field">
        <label for="auth-email">Correo</label>
        <input type="email" id="auth-email" placeholder="tu@correo.com" required />
      </div>

      <div class="field">
        <label for="auth-password">Contraseña</label>
        <input type="password" id="auth-password" placeholder="••••••••" required />
        <ul class="pw-hints" id="pw-hints" hidden aria-live="polite">
          <li id="hint-length">Mínimo 5 caracteres</li>
          <li id="hint-number">Al menos 1 número</li>
          <li id="hint-special">Al menos 1 carácter especial (!@#$...)</li>
        </ul>
      </div>

      <!-- ── Solo en REGISTRO ── -->
      <div class="field" id="confirm-field" hidden>
        <label for="auth-confirm">Confirmar contraseña</label>
        <input type="password" id="auth-confirm" placeholder="••••••••" />
        <p class="confirm-hint" id="confirm-hint"></p>
      </div>

      <button type="submit" class="btn" id="btn-submit" style="width:100%;margin-top:4px">
        Iniciar sesión
      </button>
      <p class="auth-note" id="auth-note" role="status"></p>
    </form>

    <p class="auth-toggle">
      <span id="toggle-label">¿No tienes cuenta? </span>
      <button id="toggle-mode">Regístrate</button>
    </p>
  </div>

  <script src="js/main.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
